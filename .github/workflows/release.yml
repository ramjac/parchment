name: Release

on:
  push:
    tags:
      - v0.5.0-beta.1

permissions:
  contents: read

jobs:
  release:
    name: Linux amd64 prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test release build
        run: CGO_ENABLED=0 go test ./...
      - name: Package and verify
        run: bash .github/scripts/package-linux-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/parchment-release"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "Parchment $GITHUB_REF_NAME" \
            --notes-file .github/release-notes/v0.5.0-beta.1.md \
            "$RUNNER_TEMP/parchment-release/parchment_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
            "$RUNNER_TEMP/parchment-release/checksums.txt"
